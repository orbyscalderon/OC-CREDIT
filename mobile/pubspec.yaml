name: oc_credit_mobile
description: OCA Credit - App de cobros para cobradores en ruta
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP & Auth
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0

  # Local DB (SQLite offline)
  sqflite: ^2.3.3
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.4

  # Forms & validation
  reactive_forms: ^17.0.0

  # ESC/POS Bluetooth printing
  print_bluetooth_thermal: ^1.0.9

  # GPS
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Mapa (OpenStreetMap, igual que el panel web con Leaflet -- sin API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UUID (idempotency)
  uuid: ^4.4.0

  # Date helpers
  intl: ^0.20.3

  # Connectivity
  connectivity_plus: ^6.0.3

  # Root / emulator detection (flutter_jailbreak_detection esta abandonado
  # desde 2023 y no soporta el toolchain Android actual)
  safe_device: ^1.4.1

  # Image / logo
  cached_network_image: ^3.3.1

  # Foto de evidencia del cobro
  image_picker: ^1.1.2

  # Login con Google (mismo flujo que el panel web)
  google_sign_in: ^6.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
