name: oc_credit_mobile
description: OCA Ruta - App de cobros para cobradores en ruta
publish_to: 'none'
version: 1.0.0+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP & Auth
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0

  # Local DB (SQLite offline)
  sqflite: ^2.3.3
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.4

  # Forms & validation
  reactive_forms: ^17.0.0

  # ESC/POS Bluetooth printing
  print_bluetooth_thermal: ^1.0.9

  # GPS
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Mapa (OpenStreetMap, igual que el panel web con Leaflet -- sin API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UUID (idempotency)
  uuid: ^4.4.0

  # Date helpers
  intl: ^0.20.3

  # Connectivity
  connectivity_plus: ^6.0.3

  # Root / emulator detection (flutter_jailbreak_detection esta abandonado
  # desde 2023 y no soporta el toolchain Android actual)
  safe_device: ^1.4.1

  # Image / logo
  cached_network_image: ^3.3.1

  # Foto de evidencia del cobro
  image_picker: ^1.1.2

  # Login con Google (mismo flujo que el panel web)
  google_sign_in: ^6.2.2

  # Compra de planes dentro de la app (Google Play Billing) -- obligatorio
  # por la política de Google para compras de suscripción hechas en apps
  # distribuidas por Play Store.
  in_app_purchase: ^3.2.0

  # Gráficos (Reportes: aging, ingresos mensuales)
  fl_chart: ^0.69.0

  # Exportar CSV (Reportes) y compartir archivos
  share_plus: ^10.0.0
  path_provider: ^2.1.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "../branding/logos/icon-1024.png"
  adaptive_icon_background: "#1D4ED8"
  adaptive_icon_foreground: "../branding/logos/icon-foreground-1024.png"
  min_sdk_android: 21
